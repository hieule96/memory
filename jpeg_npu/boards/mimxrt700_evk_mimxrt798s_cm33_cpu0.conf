CONFIG_DCACHE=n
# Decoder: 2 input + 1 output
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=3
# Each buffer is estimated at width * height * 2 bytes (NV12 needs two full
# planes for the JPEG decoder): 3 * 576 * 432 * 2 + alignment, in SRAM1
# (2 MiB) next to the model and tensor arena.
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=1545000
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION=y
CONFIG_VIDEO_BUFFER_POOL_ZEPHYR_REGION_NAME="SRAM1"

CONFIG_MPIPE_VID=y
# The hardware decoder is used: keep the software decoder's pool minimal
CONFIG_MPIPE_IMG_JPEG_DECODER_MAX_OUT_FRAME_SIZE=4

# Neutron NPU: operators the compiler did not offload run on CMSIS-NN
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_FPU=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
CONFIG_TFLM_NXP_NEUTRON=y

# The model and the arena do not fit the 512 KiB default RAM. SRAM1 is within
# the 5.5 MiB the NPU can address.
CONFIG_MODEL_ZEPHYR_REGION=y
CONFIG_MODEL_ZEPHYR_REGION_NAME="SRAM1"
